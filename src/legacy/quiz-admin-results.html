<script>
const QUIZ_ID = new URLSearchParams(location.search).get('quiz_id');

function resultsPage() {
return {
loading: true,
quizId: QUIZ_ID,
quiz: {},
submissions: [],
search: '',
sortBy: 'newest',
detailSub: null,
detailData: null,
loadingDetail: false,
deleteSubTarget: null,

get filteredSubs() {
let list = this.submissions.filter(s => {
const q = this.search.toLowerCase();
return !q || s.name.toLowerCase().includes(q) || (s.nim||'').toLowerCase().includes(q);
});
switch (this.sortBy) {
case 'oldest':    list.sort((a,b) => a.submitted_at.localeCompare(b.submitted_at)); break;
case 'score_high':list.sort((a,b) => b.percentage - a.percentage); break;
case 'score_low': list.sort((a,b) => a.percentage - b.percentage); break;
case 'name':      list.sort((a,b) => a.name.localeCompare(b.name)); break;
default:          list.sort((a,b) => b.submitted_at.localeCompare(a.submitted_at));
}
return list;
},

get avgScore() {
if (!this.submissions.length) return 0;
return Math.round(this.submissions.reduce((s,x) => s + x.percentage, 0) / this.submissions.length);
},

get maxScore() {
if (!this.submissions.length) return 0;
return Math.round(Math.max(...this.submissions.map(s => s.percentage)));
},

get minScore() {
if (!this.submissions.length) return 0;
return Math.round(Math.min(...this.submissions.map(s => s.percentage)));
},

get passCount() {
return this.submissions.filter(s => s.passed).length;
},

get failCount() {
return this.submissions.filter(s => !s.passed).length;
},

get scoreBands() {
const count = (min, max) => this.submissions.filter(s => s.percentage >= min && s.percentage < max).length;
return [
{ label: '90-100%', count: this.submissions.filter(s => s.percentage >= 90).length, color: 'text-green-600', bg: '#22c55e' },
{ label: '75-89%',  count: count(75, 90),  color: 'text-teal-600',  bg: '#14b8a6' },
{ label: '60-74%',  count: count(60, 75),  color: 'text-amber-600', bg: '#f59e0b' },
{ label: '40-59%',  count: count(40, 60),  color: 'text-orange-600',bg: '#f97316' },
{ label: '0-39%',   count: count(0, 40),   color: 'text-red-600',   bg: '#ef4444' },
];
},

async init() {
const dark = localStorage.getItem('darkMode') === 'enabled';
if (dark) document.documentElement.classList.add('dark');

if (!QUIZ_ID) { this.loading = false; return; }

await Promise.all([this.loadQuiz(), this.loadSubmissions()]);
this.loading = false;
},

async loadQuiz() {
try {
const res = await fetch('/api/quiz?action=get_quiz&id=' + QUIZ_ID);
const data = await res.json();
if (data.ok) this.quiz = data.quiz;
} catch(e) {}
},

async loadSubmissions() {
try {
const res = await fetch('/api/quiz?action=list_submissions&quiz_id=' + QUIZ_ID);
const data = await res.json();
if (data.ok) this.submissions = data.submissions;
} catch(e) {}
},

async openDetail(s) {
this.detailSub = s;
this.detailData = null;
this.loadingDetail = true;
try {
const res = await fetch(`/api/quiz?action=get_submission&quiz_id=${QUIZ_ID}&sub_id=${s.id}`);
const data = await res.json();
if (data.ok) this.detailData = data;
} catch(e) {}
this.loadingDetail = false;
},

confirmDeleteSub(s) { this.deleteSubTarget = s; },

async doDeleteSub() {
if (!this.deleteSubTarget) return;
const res = await fetch('/api/quiz?action=delete_submission', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ quiz_id: QUIZ_ID, sub_id: this.deleteSubTarget.id }),
});
const data = await res.json();
if (data.ok) {
this.submissions = this.submissions.filter(s => s.id !== this.deleteSubTarget.id);
this.toast('Pengerjaan dihapus', 'success');
}
this.deleteSubTarget = null;
},

exportExcel() {
if (!this.submissions.length) { this.toast('Tidak ada data', 'warning'); return; }
const rows = [['No','Nama','NIM','Skor (%)','Poin','Total Poin','Status','Waktu (detik)','Tanggal Submit']];
this.submissions.forEach((s, i) => {
rows.push([
i + 1, s.name, s.nim || '', Math.round(s.percentage), s.score, s.total,
s.passed ? 'Lulus' : 'Tidak Lulus', s.time_taken || 0, s.submitted_at,
]);
});
const wb = XLSX.utils.book_new();
const ws = XLSX.utils.aoa_to_sheet(rows);
ws['!cols'] = [{wch:4},{wch:30},{wch:15},{wch:10},{wch:8},{wch:10},{wch:12},{wch:14},{wch:22}];
XLSX.utils.book_append_sheet(wb, ws, 'Hasil');
XLSX.writeFile(wb, 'hasil_' + (this.quiz.title||'quiz').replace(/\s+/g,'_') + '_' + new Date().toISOString().slice(0,10) + '.xlsx');
this.toast('Diekspor!', 'success');
},

copyLink() {
const url = location.origin + '/quiz/take?id=' + QUIZ_ID;
navigator.clipboard.writeText(url).then(() => this.toast('Link disalin!', 'success'));
},

formatTime(secs) {
if (!secs) return '-';
const m = Math.floor(secs / 60), s = secs % 60;
return m > 0 ? `${m}m ${s}s` : `${s}s`;
},

formatDate(iso) {
if (!iso) return '-';
return new Date(iso).toLocaleString('id-ID', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
},

getAnswerDisplay(q, ans) {
if (ans === undefined || ans === null || ans === '') return '(tidak dijawab)';
if (['multiple_choice','dropdown'].includes(q.type)) return q.options?.[ans]?.text || ans;
if (q.type === 'checkbox') return Array.isArray(ans) ? ans.map(i => q.options?.[i]?.text || i).join(', ') : ans;
if (q.type === 'true_false') return ans === 'true' ? 'Benar' : 'Salah';
return String(ans);
},

getCorrectDisplay(q) {
if (['multiple_choice','dropdown'].includes(q.type)) return q.correctAnswer !== null ? (q.options?.[q.correctAnswer]?.text || '-') : '-';
if (q.type === 'checkbox') return (q.correctAnswers||[]).map(i => q.options?.[i]?.text || i).join(', ');
if (q.type === 'true_false') return q.correctAnswer === 'true' ? 'Benar' : 'Salah';
return q.correctAnswer || '-';
},

toast(msg, type = 'info') {
const root = document.getElementById('toast-root');
const colors = { success:'bg-green-100 dark:bg-green-800/90 border-green-300 text-green-800 dark:text-green-100', error:'bg-red-100 dark:bg-red-800/90 border-red-300 text-red-800 dark:text-red-100', info:'bg-blue-100 dark:bg-blue-800/90 border-blue-300 text-blue-800 dark:text-blue-100', warning:'bg-amber-100 dark:bg-amber-800/90 border-amber-300 text-amber-800 dark:text-amber-100' };
const t = document.createElement('div');
t.className = `toast-item flex items-center gap-2 px-4 py-3 rounded-xl border shadow-lg text-sm font-medium max-w-xs ${colors[type]||colors.info}`;
t.innerHTML = `<span>${msg}</span>`;
root.appendChild(t);
requestAnimationFrame(() => t.classList.add('show'));
setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 350); }, 3500);
},
};
}
</script>
