<script>
function pesertaPage() {
return {
loading: true,
quizzes: [],
search: '',

get filtered() {
const q = this.search.trim().toLowerCase();
if (!q) return this.quizzes;
return this.quizzes.filter(x =>
(x.title || '').toLowerCase().includes(q) ||
(x.description || '').toLowerCase().includes(q)
);
},

kelas: '',
async init() {
window.addEventListener('kelas-quiz', (e) => { this.kelas = e.detail || ''; this.muat(); });
this.kelas = window.__kelasQuiz || '';
await this.muat();
},
async muat() {
this.loading = true;
try {
const res = await fetch('/api/quiz?action=list_open_quizzes&kelas=' + encodeURIComponent(this.kelas || ''));
const data = await res.json();
if (data.ok) this.quizzes = data.quizzes || [];
} catch (e) {
this.quizzes = [];
}
this.loading = false;
},
};
}
</script>
