
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[90vw] h-[500px] blur-[150px] rounded-full opacity-20 -z-10 pointer-events-none transition-colors duration-1000" style="background-color: var(--accent-main);"></div>
    <div class="absolute top-6 right-6 flex gap-2 p-2 rounded-2xl dynamic-bg border shadow-lg z-40">
        <button onclick="setTheme('light')" id="btn-light" class="theme-btn w-10 h-10 rounded-xl">☀️</button>
        <button onclick="setTheme('cinema')" id="btn-cinema" class="theme-btn w-10 h-10 rounded-xl">🎬</button>
        <button onclick="setTheme('cyber')" id="btn-cyber" class="theme-btn w-10 h-10 rounded-xl">🚀</button>
        <button onclick="setTheme('airplane')" id="btn-airplane" class="theme-btn w-10 h-10 rounded-xl">✈️</button>
    </div>

    <div class="max-w-6xl mx-auto px-4 py-16">
        <div class="text-center mb-14 relative z-10">
            <h1 class="text-4xl md:text-5xl font-black tracking-tight mb-3 dynamic-text drop-shadow-sm">Kontrak Tempat Duduk</h1>
            <h2 class="text-lg md:text-xl font-bold dynamic-muted tracking-wide uppercase">SAQ Laboratory</h2>
        </div>

        <!--IF_TUTUP-->
            <div class="max-w-xl mx-auto dynamic-bg p-12 rounded-[2rem] shadow-2xl border text-center relative overflow-hidden">
                <div class="w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 border-4 border-dashed transition-colors" style="border-color: var(--border-card);">
                    <svg class="w-10 h-10 dynamic-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h3 class="text-3xl font-black dynamic-text mb-2">Pintu Belum Dibuka</h3>
                <p class="dynamic-muted font-medium text-lg">Sesi belum dimulai. Silakan tunggu asisten SAQ membuka kelas.</p>
            </div>
        <!--ELSE-->
            <div class="max-w-fit mx-auto dynamic-bg px-8 py-3 rounded-2xl shadow-xl border mb-12 flex items-center gap-4 transition-transform hover:scale-105">
                <span class="relative flex h-4 w-4">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75" style="background-color: var(--accent-main);"></span>
                    <span class="relative inline-flex rounded-full h-4 w-4" style="background-color: var(--accent-main);"></span>
                </span>
                <span class="font-bold dynamic-text tracking-widest text-sm uppercase">Sesi Berlangsung:</span>
                <span class="font-black text-xl tracking-tight" style="color: var(--accent-main);">{{MK}} <span class="opacity-70">({{KELAS}})</span></span>
            </div>

            <div class="room-layout rounded-[3rem] p-6 md:p-14 relative overflow-hidden transition-colors duration-500">
                <div class="relative w-full max-w-2xl mx-auto mb-24 flex justify-center perspective-[1000px]">
                    <div class="w-full h-6 rounded-[100%] stage-screen transition-colors duration-500 relative z-10 border-t border-white/20"></div>
                    <div class="absolute -bottom-12 w-[95%] h-24 blur-3xl opacity-40 rounded-full transition-colors duration-500 z-0" style="background-color: var(--accent-main);"></div>
                    <div id="stage-text" class="absolute -top-6 px-10 py-2.5 rounded-2xl text-xs font-black tracking-[0.3em] uppercase border-2 shadow-xl z-20 transition-colors duration-500" style="background-color: var(--bg-card); color: var(--text-main); border-color: var(--border-card);">Meja Asisten</div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-x-12 md:gap-x-20 gap-y-12 relative z-10" id="seat-container"></div>
            </div>

            <div id="booking-modal" class="fixed inset-0 bg-black/70 backdrop-blur-lg hidden flex items-center justify-center z-50 transition-all opacity-0 duration-300">
                <div class="dynamic-bg rounded-[2.5rem] shadow-2xl w-full max-w-lg p-10 transform scale-95 transition-transform duration-300 border border-white/10" id="modal-content">
                    <div class="flex justify-between items-start mb-8 border-b-2 pb-6 border-dashed" style="border-color: var(--border-card);">
                        <div>
                            <p id="modal-ticket-type" class="text-[11px] font-black uppercase tracking-[0.2em]" style="color: var(--accent-main);">Boarding Pass</p>
                            <h3 class="text-5xl font-black dynamic-text mt-2 tracking-tighter">PC <span id="modal-pc-number"></span></h3>
                        </div>
                        <div class="text-right">
                            <p class="text-[11px] font-black uppercase tracking-[0.2em] dynamic-muted">Sesi Grup</p>
                            <p class="text-base font-bold dynamic-text mt-2 truncate w-32 bg-black/5 px-3 py-1 rounded-lg">{{KELAS}}</p>
                        </div>
                    </div>
                    <form id="booking-form" action="/kontrak/booking" method="POST" class="space-y-6">
                        <input type="hidden" name="nomor_bangku" id="input-nomor-bangku">
                        <div><label class="text-xs font-black dynamic-muted uppercase tracking-widest ml-1">Nomor Induk Mahasiswa</label><input type="text" name="nim" inputmode="numeric" pattern="[0-9]*" autocomplete="off" required class="w-full px-6 py-4 rounded-2xl border-2 dynamic-input mt-2 transition-all font-bold text-lg"></div>
                        <div><label class="text-xs font-black dynamic-muted uppercase tracking-widest ml-1">Nama Lengkap Sesuai Siakad</label><input type="text" name="nama" required class="w-full px-6 py-4 rounded-2xl border-2 dynamic-input mt-2 transition-all font-bold text-lg"></div>
                        
                        <div class="mt-8 p-6 rounded-3xl border-2 transition-colors relative overflow-hidden" style="background-color: var(--seat-mine); border-color: var(--seat-mine-border);">
                            <svg class="absolute -right-4 -bottom-4 w-24 h-24 opacity-10" fill="currentColor" viewBox="0 0 24 24" style="color: var(--accent-main);"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <label class="flex items-start gap-5 cursor-pointer relative z-10">
                                <input type="checkbox" name="janji" required class="mt-1 w-7 h-7 rounded-lg cursor-pointer appearance-none border-2 checked:border-transparent flex-shrink-0 transition-all flex items-center justify-center shadow-inner" style="border-color: var(--accent-main); background-color: var(--bg-card);" onchange="this.style.backgroundColor = this.checked ? 'var(--accent-main)' : 'var(--bg-card)'">
                                <span class="text-sm font-semibold dynamic-text leading-relaxed">Saya berjanji menjaga fasilitas <span class="font-black" style="color: var(--accent-main);">PC <span id="janji-pc"></span></span> selama 1 semester dan bertanggung jawab penuh jika terjadi kerusakan.</span>
                            </label>
                        </div>
                        <div class="flex gap-4 pt-6 mt-8">
                            <button type="button" onclick="closeModal()" class="w-1/3 py-4 dynamic-text font-black uppercase tracking-widest rounded-2xl border-2 hover:bg-black/5 transition-colors text-sm" style="border-color: var(--border-card);">Batal</button>
                            <button type="submit" class="w-2/3 py-4 text-white font-black uppercase tracking-widest rounded-2xl shadow-xl transition-transform active:scale-95 flex justify-center items-center gap-3 text-sm" style="background-color: var(--accent-main); box-shadow: 0 10px 25px -5px var(--accent-glow);">Konfirmasi Kursi</button>
                        </div>
                    </form>
                </div>
            </div>

            <script>
                // Theme Logic
                const savedTheme = localStorage.getItem('saq_theme') || 'cinema'; 
                function setTheme(themeName) { document.documentElement.setAttribute('data-theme', themeName); localStorage.setItem('saq_theme', themeName); document.querySelectorAll('.theme-btn').forEach(btn => { btn.classList.remove('active'); btn.style.backgroundColor = 'var(--bg-card)'; btn.style.borderColor = 'transparent'; btn.style.color = 'var(--text-main)'; }); const activeBtn = document.getElementById(`btn-${themeName}`); if(activeBtn) { activeBtn.classList.add('active'); activeBtn.style.backgroundColor = 'var(--accent-main)'; activeBtn.style.borderColor = 'var(--accent-main)'; activeBtn.style.color = '#ffffff'; } }
                setTheme(savedTheme);

                const pcKamuSaatIni = {{PC}};
                const dataBangkuDb = {{DATA}};
                const container = document.getElementById('seat-container');
                
                const blockKiri = document.createElement('div'); const blockTengah = document.createElement('div'); const blockKanan = document.createElement('div');
                [blockKiri, blockTengah, blockKanan].forEach(block => { block.className = "grid grid-cols-2 gap-4 md:gap-6"; container.appendChild(block); });

                function renderSeat(i, isTerisi, nama) {
                    let isPCKamu = (i === pcKamuSaatIni);
                    let seat = document.createElement('div');
                    seat.id = `seat-box-${i}`; // ID untuk Live Update
                    seat.style.animationDelay = `${i * 0.03}s`;
                    
                    if (isTerisi) {
                        seat.className = `seat-card status-terisi relative h-24 md:h-28 flex flex-col items-center justify-center cursor-not-allowed select-none overflow-hidden`;
                        seat.style.backgroundColor = 'var(--seat-taken)'; seat.style.borderColor = 'var(--seat-taken-border)'; seat.style.borderBottomWidth = '3px'; seat.style.color = 'var(--seat-taken-text)';
                        seat.innerHTML = `<div class="absolute inset-0 opacity-10 bg-[repeating-linear-gradient(45deg,transparent,transparent_10px,#000_10px,#000_12px)]"></div><span class="text-3xl font-black relative z-10 opacity-40">${i}</span><span class="absolute bottom-2 text-[10px] font-black tracking-widest uppercase opacity-40">Terisi</span>`;
                        seat.onclick = () => { Swal.fire({title: 'Sudah Dipesan!', text: `Kursi PC ${i} sudah dikontrak oleh ${nama}.`, icon: 'info', background: 'var(--bg-card)', color: 'var(--text-main)', confirmButtonColor: 'var(--accent-main)'}); };
                    } else if (isPCKamu) {
                        seat.className = `seat-card seat-available relative h-24 md:h-28 flex flex-col items-center justify-center cursor-pointer select-none overflow-hidden`;
                        seat.style.backgroundColor = 'var(--seat-mine)'; seat.style.borderColor = 'var(--seat-mine-border)'; seat.style.borderBottomColor = 'var(--seat-mine-bottom)'; seat.style.color = 'var(--text-main)'; seat.style.boxShadow = '0 0 25px var(--accent-glow)';
                        seat.innerHTML = `<span class="text-3xl font-black drop-shadow-md">${i}</span><span class="absolute bottom-2 text-[10px] font-black tracking-widest uppercase bg-white/50 px-2 py-0.5 rounded-md" style="color: var(--accent-main); backdrop-filter: blur(4px);">Posisi Anda</span>`;
                        seat.onclick = () => openModal(i);
                    } else {
                        seat.className = `seat-card seat-available relative h-24 md:h-28 flex flex-col items-center justify-center cursor-pointer select-none overflow-hidden`;
                        seat.style.color = 'var(--text-main)'; seat.innerHTML = `<span class="text-3xl font-black">${i}</span>`;
                        
                        // VALIDASI FRONTEND STRICT: Tidak bisa buka form PC lain
                        seat.onclick = () => {
                            if (pcKamuSaatIni >= 1 && pcKamuSaatIni <= {{JUMLAH_PC}}) {
                                Swal.fire({ title: 'Bukan Posisi Anda!', text: `Anda terdeteksi di jaringan sebagai PC ${pcKamuSaatIni}. Silakan klik PC Anda sendiri untuk mengisi kontrak.`, icon: 'warning', background: 'var(--bg-card)', color: 'var(--text-main)', confirmButtonColor: 'var(--accent-main)' });
                            } else { openModal(i); } // Bypass jika admin akses dari luar IP lab
                        };
                    }
                    return seat;
                }

                // Render Awal
                for (let i = 1; i <= {{JUMLAH_PC}}; i++) {
                    let status = dataBangkuDb[i] ? dataBangkuDb[i].status : 'kosong';
                    let seat = renderSeat(i, status === 'terisi', dataBangkuDb[i] ? dataBangkuDb[i].nama : '');
                    if (i % 6 === 1 || i % 6 === 2) blockKiri.appendChild(seat); else if (i % 6 === 3 || i % 6 === 4) blockTengah.appendChild(seat); else blockKanan.appendChild(seat);
                }

                // LIVE SEAT UPDATE (AJAX SETIAP 3 DETIK)
                setInterval(() => {
                    fetch('/api/kontrak/kursi')
                    .then(response => response.json())
                    .then(data => {
                        if (!data.error) {
                            for (let i = 1; i <= {{JUMLAH_PC}}; i++) {
                                let seatEl = document.getElementById(`seat-box-${i}`);
                                if (seatEl && data[i] && data[i].status === 'terisi' && !seatEl.classList.contains('status-terisi')) {
                                    // Jika data di server terisi, tapi di layar masih kosong -> UPDATE LAYAR
                                    let newSeat = renderSeat(i, true, data[i].nama);
                                    newSeat.style.animationDelay = '0s'; // Hapus delay
                                    seatEl.replaceWith(newSeat); // Ganti kotak lama dengan kotak merah
                                }
                            }
                        }
                    }).catch(err => console.log('Gagal sync data live', err));
                }, 3000);

                const modal = document.getElementById('booking-modal');
                const modalContent = document.getElementById('modal-content');
                function openModal(pc) { document.getElementById('modal-pc-number').innerText = pc; document.getElementById('janji-pc').innerText = pc; document.getElementById('input-nomor-bangku').value = pc; modal.classList.remove('hidden'); setTimeout(() => { modal.classList.remove('opacity-0'); modalContent.classList.remove('scale-95'); modalContent.classList.add('scale-100'); }, 10); }
                function closeModal() { modal.classList.add('opacity-0'); modalContent.classList.remove('scale-100'); modalContent.classList.add('scale-95'); setTimeout(() => { modal.classList.add('hidden'); document.getElementById('booking-form').reset(); document.querySelector('input[name="janji"]').style.backgroundColor = 'var(--bg-card)'; }, 300); }

            </script>
        <!--ENDIF-->
    </div>

    <script>
                // FITUR LAPOR KERUSAKAN MENGGUNAKAN SWEETALERT
                function bukaLaporKerusakan() {
                    let options = '';
                    for(let i=1; i<={{JUMLAH_PC}}; i++) options += `<option value="${i}">Bangku PC ${i}</option>`;

                    Swal.fire({
                        title: 'Lapor Kerusakan Hardware',
                        html: `
                            <form id="form-lapor" action="/kontrak/lapor" method="POST" class="text-left mt-4">
                                <label class="block text-xs font-black text-slate-400 mb-1 uppercase tracking-widest">Nomor PC yang Bermasalah</label>
                                <select name="pc" class="w-full p-3 mb-4 rounded-xl bg-slate-800 text-white border border-slate-600 focus:border-red-500 outline-none" required>
                                    <option value="">-- Pilih Nomor PC --</option>
                                    ${options}
                                </select>
                                
                                <label class="block text-xs font-black text-slate-400 mb-1 uppercase tracking-widest">Kategori Kendala</label>
                                <select name="kategori" class="w-full p-3 mb-4 rounded-xl bg-slate-800 text-white border border-slate-600 focus:border-red-500 outline-none" required>
                                    <option value="Mouse / Keyboard Error">🖱️ Mouse / Keyboard Error</option>
                                    <option value="Monitor Blank / Kabel Kendor">🖥️ Monitor Blank / Kabel Kendor</option>
                                    <option value="PC Blue Screen / Sering Mati">🛑 PC Blue Screen / Sering Mati</option>
                                    <option value="Internet / Jaringan Putus">🌐 Internet / Jaringan Putus</option>
                                    <option value="Aplikasi Hilang / Error">⚙️ Aplikasi Hilang / Error</option>
                                </select>
                                
                                <label class="block text-xs font-black text-slate-400 mb-1 uppercase tracking-widest">Deskripsi (Opsional)</label>
                                <textarea name="deskripsi" class="w-full p-3 rounded-xl bg-slate-800 text-white border border-slate-600 focus:border-red-500 outline-none" rows="2" placeholder="Contoh: Mouse klik kiri kadang macet..."></textarea>
                            </form>
                        `,
                        background: '#0f172a',
                        color: '#f8fafc',
                        showCancelButton: true,
                        confirmButtonText: 'Kirim Laporan',
                        cancelButtonText: 'Batal',
                        confirmButtonColor: '#dc2626',
                        customClass: { popup: 'rounded-[2rem] border border-slate-700' },
                        preConfirm: () => {
                            const form = document.getElementById('form-lapor');
                            if(!form.pc.value) { Swal.showValidationMessage('Silakan pilih nomor PC!'); return false; }
                            form.submit();
                        }
                    });
                }
    </script>
    <button onclick="bukaLaporKerusakan()" class="fixed bottom-6 right-6 md:bottom-10 md:right-10 bg-red-600 hover:bg-red-700 text-white p-4 rounded-full shadow-[0_10px_25px_rgba(220,38,38,0.5)] z-50 flex items-center justify-center gap-3 hover:scale-110 transition-transform border-2 border-red-400 group">
        <svg class="w-6 h-6 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        <span class="font-black tracking-wider uppercase text-xs hidden md:block group-hover:inline-block">Lapor PC Rusak</span>
    </button>
